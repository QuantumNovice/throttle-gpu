name: Build and deploy API docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate HTML from Python docstrings
        run: |
          mkdir -p site
          export PYTHONPATH="$GITHUB_WORKSPACE/src"
          python -m pydoc -w throttle_gpu throttle_gpu.errors throttle_gpu.guard throttle_gpu.isolated throttle_gpu.policy throttle_gpu.sources throttle_gpu.cli
          cp throttle_gpu.html site/index.html
          cp throttle_gpu.*.html site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
