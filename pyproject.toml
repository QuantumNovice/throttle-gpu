[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "throttle-gpu"
version = "0.1.0"
description = "Guard rails for GPU-heavy Python code: stop execution when GPU temperature exceeds a limit."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "QuantumNovice" }]
keywords = ["gpu", "nvidia", "temperature", "thermal", "monitoring", "cuda", "guard"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Hardware",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = ["nvidia-ml-py>=12.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "build>=1.2"]

[project.scripts]
throttle-gpu = "throttle_gpu.cli:main"

[project.urls]
Homepage = "https://github.com/QuantumNovice/throttle-gpu"
Repository = "https://github.com/QuantumNovice/throttle-gpu"
Issues = "https://github.com/QuantumNovice/throttle-gpu/issues"
Changelog = "https://github.com/QuantumNovice/throttle-gpu/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/throttle_gpu"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "CHANGELOG.md", "CONTRIBUTING.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
